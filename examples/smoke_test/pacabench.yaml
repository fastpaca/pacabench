name: smoke-test
description: Offline echo-agent smoke test. No API key and no network.
version: "0.1.0"

config:
  concurrency: 2
  timeout_seconds: 30
  max_retries: 0
  proxy:
    enabled: false

agents:
  - name: "echo-agent"
    command: "python agents/echo_agent.py"

datasets:
  - name: "example-data"
    source: "data/example.jsonl"
    input_map:
      input: "question"
      expected: "answer"
    evaluator:
      type: "exact_match"

output:
  directory: "./runs"
